name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Environment & Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a3d80e4447e64503da48c0c68e4" >> "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo "d56f5187479451eabf01fb7852b930e304f0b957" >> "$ANDROID_HOME/licenses/android-sdk-license"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Android APK (Debug)
        run: |
          cd android
          gradle wrapper --gradle-version 8.7
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon > ../build.log 2>&1 || (
            echo "::error::Gradle build failed, printing log..."
            cat ../build.log
            exit 1
          )

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MySpotify-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
