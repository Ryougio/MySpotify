name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Environment & Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a3d80e4447e64503da48c0c68e4" >> "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo "d56f5187479451eabf01fb7852b930e304f0b957" >> "$ANDROID_HOME/licenses/android-sdk-license"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Build Android APK (Debug)
        run: |
          cd android
          gradle assembleDebug --stacktrace --no-daemon > ../build.log 2>&1 || {
            echo "First build attempt hit transient network issue, retrying in 5 seconds..."
            sleep 5
            gradle assembleDebug --stacktrace --no-daemon > ../build.log 2>&1 || {
              echo "::error title=FirstError::$(grep -m 1 -E 'error:|FAILED|Exception' ../build.log | tr -d '\r\n')"
              echo "::error title=Cause::$(grep -m 1 -A 2 'Caused by:' ../build.log | tr '\r\n' ' ')"
              echo "::error title=WhatWentWrong::$(grep -m 1 -A 2 'What went wrong:' ../build.log | tr '\r\n' ' ')"
              cat ../build.log
              exit 1
            }
          }

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MySpotify-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish Direct APK Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: mobile-v0.4.37
          name: "MySpotify Mobile Edition (v0.4.37 - Upstream Sync: Equalizer, Quality Badge, Daily Mix Fallback, Playlist Filter & Speed)"
          body: |
            ### MySpotify Android 客户端 (v0.4.37 上游全量同步版)
            - **同步上游 v0.4.37 & v0.4.35（每日推荐防丢与兜底分页）**：修复首页当天无 Daily Mix 导致推荐为空的问题，自动分页检索「为你打造（Made For You）」页面并本地缓存上次每日推荐。
            - **同步上游 v0.4.36（6 段原生硬件均衡器 + 22 预设）**：基于 Android 原生 `AudioEffect Equalizer`，在「设置 › 均衡器」完整复刻桌面端 6 频段（60Hz~15kHz）与 22 个官方预设（低音增强/人声增强/摇滚/流行/古典/电子/爵士等）。
            - **同步上游 v0.4.36（音质徽章）**：播放页歌名旁实时展示当前音质标识（`256k` / `HQ`）。
            - **同步上游 v0.4.30（歌单内快速筛选）**：歌单超过 12 首时自动显示多词空格搜索筛选框，点击播放仅播放筛选匹配队列。
            - **同步上游 v0.4.28（倍速播放）**：全屏播放页支持 `0.5×` ~ `2.0×` 变速不变调播放。
            - **包含 v0.4.34 全部移动端增强**：Android 逐级返回栈、触控可拖拽进度条、首页音乐/播客过滤、音乐库专辑/艺人切换、多维度搜索与艺人主页关注、官方排行榜、最近播放及全量分页同步。
          files: android/app/build/outputs/apk/debug/*.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
