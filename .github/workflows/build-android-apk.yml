name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Environment & Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a3d80e4447e64503da48c0c68e4" >> "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo "d56f5187479451eabf01fb7852b930e304f0b957" >> "$ANDROID_HOME/licenses/android-sdk-license"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Build Android APK (Debug)
        run: |
          cd android
          gradle assembleDebug --stacktrace --no-daemon > ../build.log 2>&1 || {
            echo "First build attempt hit transient network issue, retrying in 5 seconds..."
            sleep 5
            gradle assembleDebug --stacktrace --no-daemon > ../build.log 2>&1 || {
              echo "::error title=FirstError::$(grep -m 1 -E 'error:|FAILED|Exception' ../build.log | tr -d '\r\n')"
              echo "::error title=Cause::$(grep -m 1 -A 2 'Caused by:' ../build.log | tr '\r\n' ' ')"
              echo "::error title=WhatWentWrong::$(grep -m 1 -A 2 'What went wrong:' ../build.log | tr '\r\n' ' ')"
              cat ../build.log
              exit 1
            }
          }

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MySpotify-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish Direct APK Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: mobile-v0.4.45
          name: "MySpotify Mobile Edition (v0.4.45 - Inline HLS Widevine Fix + Full Track Guarantee + Persistent Debug Keystore)"
          body: |
            ### MySpotify Android 客户端 (v0.4.45 完整原曲稳定版)
            - **彻底根治「变成 30 秒试听」的元凶（`Hls is not defined`）**：
              1. 将 `hls.min.js` 直接内联打包进 `player.html` 单次 HTTP 响应中（[LocalMediaServer.java](android/app/src/main/java/dev/margbug/vinyl/LocalMediaServer.java)），杜绝锁屏/后台启动时外部脚本加载中断导致的 `Hls is not defined` 错误。
              2. 已登录 Spotify 账号播歌时禁止静默降级为 30 秒 iTunes 试听，始终坚持播放 Spotify 官方 Widevine 完整原曲（并持久化记住 Free 账号 128k 档位，下次冷启动无需再试探 256k 403）。
            - **固定 APK 调试签名（`android/debug.keystore`）**：从本版本起，后续所有版本更新均可直接覆盖安装，不再卸载清数据、不再需要反复重新登录！
          files: android/app/build/outputs/apk/debug/*.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
