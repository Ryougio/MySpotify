name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Environment & Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a3d80e4447e64503da48c0c68e4" >> "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo "d56f5187479451eabf01fb7852b930e304f0b957" >> "$ANDROID_HOME/licenses/android-sdk-license"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Build Android APK (Debug)
        run: |
          cd android
          gradle assembleDebug --stacktrace --no-daemon > ../build.log 2>&1 || {
            echo "First build attempt hit transient network issue, retrying in 5 seconds..."
            sleep 5
            gradle assembleDebug --stacktrace --no-daemon > ../build.log 2>&1 || {
              echo "::error title=FirstError::$(grep -m 1 -E 'error:|FAILED|Exception' ../build.log | tr -d '\r\n')"
              echo "::error title=Cause::$(grep -m 1 -A 2 'Caused by:' ../build.log | tr '\r\n' ' ')"
              echo "::error title=WhatWentWrong::$(grep -m 1 -A 2 'What went wrong:' ../build.log | tr '\r\n' ' ')"
              cat ../build.log
              exit 1
            }
          }

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MySpotify-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish Direct APK Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: mobile-v0.4.31
          name: "MySpotify Mobile Edition (v0.4.31)"
          body: |
            ### MySpotify Android 客户端 (Windows 桌面端与 Apple Design 1:1 复刻版)
            - **1:1 复刻桌面端原版美学**：精细还原 Windows 截图中的浅色基调（#f5f5f7 画布、#efeff1 侧栏、纯白卡片与 Apple 红强调色），同时完美支持深色模式。
            - **底层通信全量重构**：彻底弃用被 429 拦截的 Web API，全面切换至 TOTP HMAC-SHA1 签名与 Spotify 官方 Pathfinder GraphQL 持久化查询引擎（profileAttributes、libraryV3、fetchLibraryTracks、fetchPlaylist、searchTracks）。
            - **完整同步个人云端**：登录后自动同步个人歌单、已点赞歌曲（我喜欢的音乐）、头像与用户名，解决报错退出登录的问题。
            - **搜索与点播完全可用**：集成搜索防抖与真实曲库检索，点击任意歌曲即可秒播，无预览曲目自动解析高品质流。
            - **完整设置页**：实验性功能（进度条烟雾特效、烟雾背景）、缓存管理（用量显示、清除缓存）、网络代理（支持自定义 127.0.0.1:7890 代理）、外观切换（浅色/深色/跟随系统）与账号管理。
            - **移动端与平板自适应**：手机端无缝呈现底部 5 栏导航与悬浮迷你播放条，上滑即为 Apple Music 逐字双语呼吸歌词大屏。
          files: android/app/build/outputs/apk/debug/*.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
