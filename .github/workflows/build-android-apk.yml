name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Environment & Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a3d80e4447e64503da48c0c68e4" >> "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo "d56f5187479451eabf01fb7852b930e304f0b957" >> "$ANDROID_HOME/licenses/android-sdk-license"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Build Android APK (Debug)
        run: |
          cd android
          gradle assembleDebug --stacktrace --no-daemon > ../build.log 2>&1 || {
            echo "First build attempt hit transient network issue, retrying in 5 seconds..."
            sleep 5
            gradle assembleDebug --stacktrace --no-daemon > ../build.log 2>&1 || {
              echo "::error title=FirstError::$(grep -m 1 -E 'error:|FAILED|Exception' ../build.log | tr -d '\r\n')"
              echo "::error title=Cause::$(grep -m 1 -A 2 'Caused by:' ../build.log | tr '\r\n' ' ')"
              echo "::error title=WhatWentWrong::$(grep -m 1 -A 2 'What went wrong:' ../build.log | tr '\r\n' ' ')"
              cat ../build.log
              exit 1
            }
          }

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MySpotify-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish Direct APK Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: mobile-v0.4.34
          name: "MySpotify Mobile Edition (v0.4.34 - Full Desktop API Parity & UX Overhaul)"
          body: |
            ### MySpotify Android 客户端 (v0.4.34 重磅功能完整版)
            - **1. Android 系统返回栈**：全面支持返回键与侧滑返回逐级退回（收起歌词 → 收起播放页 → 返回上一级页面 → 回到首页 → 双击退出），不再直接退回桌面。
            - **2. 丝滑可拖拽进度条 + 真实队列上下曲**：支持移动端 Touch 拖拽与精准点按进度条，拖拽期间防原生回调跳动，新增真实播放队列上下曲切换。
            - **3. 首页与音乐库过滤全部实装**：首页「全部 / 音乐 / 播客」真实对接 Spotify `home` (`facet`) 接口；音乐库「全部 / 播放列表 / 专辑 / 艺人」完整解析并支持点击进入详情。
            - **4. 多维度搜索 + 艺人主页关注 + 分类推荐歌单**：搜索同步桌面端展示圆形艺人头像、专辑、歌单与歌曲；点击艺人进入专属艺人主页（支持「关注 / 已关注」、热门歌曲、发行专辑、相关艺人）；浏览全部改用真实 `browseAll` / `browsePage` 展示对应流派精选歌单。
            - **5. 桌面端核心频道完整移植**：彻底移除硬编码占位歌曲，首页接入真实 Spotify 为你推荐，并完整实现「每日推荐」、「Spotify 官方排行榜（全球/台湾/香港/日本/韩国等）」、「最近播放」、「浏览」全部页面。
            - **6. 全量分页同步**：`libraryV3`、`fetchLibraryTracks`（我喜欢的音乐）、`fetchPlaylist`、`getAlbum` 全部启用完整自动分页拉取，彻底解决歌单与喜欢歌曲同步不全问题。
          files: android/app/build/outputs/apk/debug/*.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
