name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Environment & Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a3d80e4447e64503da48c0c68e4" >> "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo "d56f5187479451eabf01fb7852b930e304f0b957" >> "$ANDROID_HOME/licenses/android-sdk-license"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Build Android APK (Debug)
        run: |
          cd android
          gradle assembleDebug --stacktrace --no-daemon > ../build.log 2>&1 || {
            echo "First build attempt hit transient network issue, retrying in 5 seconds..."
            sleep 5
            gradle assembleDebug --stacktrace --no-daemon > ../build.log 2>&1 || {
              echo "::error title=FirstError::$(grep -m 1 -E 'error:|FAILED|Exception' ../build.log | tr -d '\r\n')"
              echo "::error title=Cause::$(grep -m 1 -A 2 'Caused by:' ../build.log | tr '\r\n' ' ')"
              echo "::error title=WhatWentWrong::$(grep -m 1 -A 2 'What went wrong:' ../build.log | tr '\r\n' ' ')"
              cat ../build.log
              exit 1
            }
          }

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MySpotify-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish Direct APK Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: mobile-v0.4.50
          name: "MySpotify Mobile Edition (v0.4.50 - Fix Spotify client-token 400 & Widevine Full-Track Playback)"
          body: |
            ### MySpotify Android 客户端 (v0.4.50 彻底修复 10 秒后静音与拖动进度条无声)
            - **定位根因**：`SpotifyApiClient` 请求 `https://clienttoken.spotify.com/v1/clienttoken` 时，OkHttp `RequestBody.create(String, MediaType)` 自动附加了 `Content-Type: application/json; charset=utf-8`，导致 Spotify 服务端返回 `HTTP 400 Bad Request`、`client-token` 始终为空；缺失 `client-token` 时 Spotify Widevine `/audio/license` 仍返回 200 但下发无效密钥，导致前 10 秒明文 Clear Lead 正常、第 10 秒起加密分段及拖动进度条后 AAC 解码持续报 `0x4004 / 0x0005` 并静音。
            - **核心修复**：改用纯 `application/json` 字节流提交 `clienttoken` 请求并在 `getIdentitySync` 中保证自动补全 `client-token`，同时清理临时调试代码。
            - **真机验证**：Samsung SM-S9110 实测多首完整曲目与任意拖动（15s / 45s / 69s / 106s / 117s），`clienttoken HTTP 200` + `hasClientToken=true`，`C2SoftAacDec` 零报错、全程清晰有声。
          files: android/app/build/outputs/apk/debug/*.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
