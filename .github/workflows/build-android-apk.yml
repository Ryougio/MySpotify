name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Environment & Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a3d80e4447e64503da48c0c68e4" >> "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo "d56f5187479451eabf01fb7852b930e304f0b957" >> "$ANDROID_HOME/licenses/android-sdk-license"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Build Android APK (Debug)
        run: |
          cd android
          gradle assembleDebug --stacktrace --no-daemon > ../build.log 2>&1 || {
            echo "First build attempt hit transient network issue, retrying in 5 seconds..."
            sleep 5
            gradle assembleDebug --stacktrace --no-daemon > ../build.log 2>&1 || {
              echo "::error title=FirstError::$(grep -m 1 -E 'error:|FAILED|Exception' ../build.log | tr -d '\r\n')"
              echo "::error title=Cause::$(grep -m 1 -A 2 'Caused by:' ../build.log | tr '\r\n' ' ')"
              echo "::error title=WhatWentWrong::$(grep -m 1 -A 2 'What went wrong:' ../build.log | tr '\r\n' ' ')"
              cat ../build.log
              exit 1
            }
          }

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MySpotify-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish Direct APK Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: mobile-v0.4.42
          name: "MySpotify Mobile Edition (v0.4.42 - Desktop v0.4.38 Sync + Instant Snapshot Cache + Smart Playlist Anti-Drop)"
          body: |
            ### MySpotify Android 客户端 (v0.4.42 桌面端无感同步与歌单稳连版)
            - **桌面端同款本地持久化快照（0ms 秒开 + 后台无感同步）**：完整移植桌面端 `session.go`（`home.json` + `session.json`），冷启动瞬间立即渲染上次的个人头像、首页推荐橱窗、全部歌单/专辑/艺人/喜欢歌曲与上次播放曲目，后台静默刷新绝不闪屏清空，网络波动自动 15 秒后静默补齐。
            - **彻底治好歌单加载 `connection closed` 断连**：针对 FlClash `tun0`（MTU 9000）导致的偶发分片断连，OkHttp 失败重试自动清空连接池、切换 HTTP/1.1 短连接，并在检测到本地 `127.0.0.1:7890` 混合端口时自动切换代理通道绕开 TUN 分片；同时新增歌单/专辑本地缓存（打开过的歌单 0ms 秒开 + 失败一键重试）。
            - **同步上游作者 v0.4.38 全部更新**：新增设置页「交叉淡入淡出 0–12 秒」滑块（#48），持久化保留随机播放与循环状态（#47），恢复上次播放队列无缝续播。
          files: android/app/build/outputs/apk/debug/*.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
