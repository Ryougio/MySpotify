name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Environment & Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a3d80e4447e64503da48c0c68e4" >> "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo "d56f5187479451eabf01fb7852b930e304f0b957" >> "$ANDROID_HOME/licenses/android-sdk-license"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Build Android APK (Debug)
        run: |
          cd android
          gradle assembleDebug --stacktrace --no-daemon > ../build.log 2>&1 || {
            echo "First build attempt hit transient network issue, retrying in 5 seconds..."
            sleep 5
            gradle assembleDebug --stacktrace --no-daemon > ../build.log 2>&1 || {
              echo "::error title=FirstError::$(grep -m 1 -E 'error:|FAILED|Exception' ../build.log | tr -d '\r\n')"
              echo "::error title=Cause::$(grep -m 1 -A 2 'Caused by:' ../build.log | tr '\r\n' ' ')"
              echo "::error title=WhatWentWrong::$(grep -m 1 -A 2 'What went wrong:' ../build.log | tr '\r\n' ' ')"
              cat ../build.log
              exit 1
            }
          }

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MySpotify-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish Direct APK Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: mobile-v0.4.51
          name: "MySpotify Mobile Edition (v0.4.51 - Scheme 1: Smart CDN Direct-First Media Routing)"
          body: |
            ### MySpotify Android 客户端 (v0.4.51 方案一：CDN 智能直连 + 自动回退)
            - **优化机制**：将音频媒体数据（占总流量 99% 的 `*.scdn.co` / Akamai / Fastly）与元数据/鉴权分流。音频分片优先尝试直连（`Proxy.NO_PROXY`），直连成功则不占用代理带宽并消除代理速度瓶颈；直连超时或受阻时（4s超时）自动无缝回退走代理，元数据与 Widevine License 依然稳定走代理。
            - **回退保障**：如果直连在特定网络环境下效果不佳，随时可一键回退到 v0.4.50。
          files: android/app/build/outputs/apk/debug/*.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
