name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Environment & Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a3d80e4447e64503da48c0c68e4" >> "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo "d56f5187479451eabf01fb7852b930e304f0b957" >> "$ANDROID_HOME/licenses/android-sdk-license"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Build Android APK (Debug)
        run: |
          cd android
          gradle assembleDebug --stacktrace --no-daemon > ../build.log 2>&1 || {
            echo "First build attempt hit transient network issue, retrying in 5 seconds..."
            sleep 5
            gradle assembleDebug --stacktrace --no-daemon > ../build.log 2>&1 || {
              echo "::error title=FirstError::$(grep -m 1 -E 'error:|FAILED|Exception' ../build.log | tr -d '\r\n')"
              echo "::error title=Cause::$(grep -m 1 -A 2 'Caused by:' ../build.log | tr '\r\n' ' ')"
              echo "::error title=WhatWentWrong::$(grep -m 1 -A 2 'What went wrong:' ../build.log | tr '\r\n' ' ')"
              cat ../build.log
              exit 1
            }
          }

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MySpotify-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish Direct APK Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: mobile-v0.4.41
          name: "MySpotify Mobile Edition (v0.4.41 - Fix IPv6 Leak Bypassing FlClash/Clash IPv4 TUN)"
          body: |
            ### MySpotify Android 客户端 (v0.4.41 代理 IPv6 泄漏导致 TLS 断连彻底修复)
            - **彻底根治 FlClash / Clash TUN 下 `SSLHandshakeException: connection closed`**：实机诊断发现移动宽带 Wi-Fi 开启 IPv6 时，Android 默认优先走直连 IPv6 绕过仅代理 IPv4（`198.18.0.1/30`）的 `tun0` 虚拟网卡，导致 Spotify TLS 握手被直接重置断连！现已在 OkHttp 底层启用 **IPv4 优先/强制解析（`Inet4Address`）**，100% 强制流量走 FlClash/VPN 隧道，杜绝直连 IPv6 泄漏。
            - **代理不可达自动降级**：若用户误填本地未监听的代理地址（如 `127.0.0.1:7890`），自动降级走系统 TUN/直连，避免死等超时。
          files: android/app/build/outputs/apk/debug/*.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
