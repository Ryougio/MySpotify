name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Environment & Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a3d80e4447e64503da48c0c68e4" >> "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo "d56f5187479451eabf01fb7852b930e304f0b957" >> "$ANDROID_HOME/licenses/android-sdk-license"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Build Android APK (Debug)
        run: |
          cd android
          gradle assembleDebug --stacktrace --no-daemon > ../build.log 2>&1 || {
            echo "First build attempt hit transient network issue, retrying in 5 seconds..."
            sleep 5
            gradle assembleDebug --stacktrace --no-daemon > ../build.log 2>&1 || {
              echo "::error title=FirstError::$(grep -m 1 -E 'error:|FAILED|Exception' ../build.log | tr -d '\r\n')"
              echo "::error title=Cause::$(grep -m 1 -A 2 'Caused by:' ../build.log | tr '\r\n' ' ')"
              echo "::error title=WhatWentWrong::$(grep -m 1 -A 2 'What went wrong:' ../build.log | tr '\r\n' ' ')"
              cat ../build.log
              exit 1
            }
          }

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MySpotify-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish Direct APK Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: mobile-v0.4.43
          name: "MySpotify Mobile Edition (v0.4.43 - Official Spotify Widevine EME Audio Engine + Bridge & ForegroundService Fix)"
          body: |
            ### MySpotify Android 客户端 (v0.4.43 官方 Widevine 原生流媒体播放引擎版)
            - **彻底修复「歌加载出来了还是放不了」三大根因**：
              1. **移植桌面端官方 Spotify Widevine EME + HLS.js 播放引擎**（完整对齐 `internal/spotify/media.go`、`mirrors.go`、`internal/player/web.go` + `player.html` + `hls.min.js`）：内置本地 `127.0.0.1` 媒体与 Widevine DRM 授权代理服务（支持 256k/128k 自动降级适配 Free 与 Premium 账号、CDN 多镜像自动切换、交叉淡入淡出 0-12 秒、倍速播放），彻底告别已失效跳转 `/404` 的网易云外链！
              2. **修复 JS-Android 桥接方法名不匹配**：统一导出 `playSpotifyTrack` / `playAudio` / `pauseAudio` / `resumeAudio` / `setCrossfade`，消除点击歌曲后静默未触发原生播放的缺陷。
              3. **修复 Android 14/15 前台播放服务启动时机与错误静默**：`MediaPlaybackService` 在 `onStartCommand` 立即启动前台通知并完整回传播放错误与锁屏控制。
            - **访客模式与异常降级**：未登录或非 Spotify 曲目自动回退至全球可用的 Apple iTunes HTTPS 试听流，不再返回 404 或假音频。
            - **网络异常诊断优化**：优化 `getServerTime` 快速回退，避免 `open.spotify.com` 握手重置拖慢同步，并在手动同步失败时清晰提示 FlClash Spotify 分流节点排查方向。
          files: android/app/build/outputs/apk/debug/*.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
