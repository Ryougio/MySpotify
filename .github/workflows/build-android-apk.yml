name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Environment & Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a3d80e4447e64503da48c0c68e4" >> "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo "d56f5187479451eabf01fb7852b930e304f0b957" >> "$ANDROID_HOME/licenses/android-sdk-license"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Build Android APK (Debug)
        run: |
          cd android
          gradle assembleDebug --stacktrace --no-daemon > ../build.log 2>&1 || {
            echo "First build attempt hit transient network issue, retrying in 5 seconds..."
            sleep 5
            gradle assembleDebug --stacktrace --no-daemon > ../build.log 2>&1 || {
              echo "::error title=FirstError::$(grep -m 1 -E 'error:|FAILED|Exception' ../build.log | tr -d '\r\n')"
              echo "::error title=Cause::$(grep -m 1 -A 2 'Caused by:' ../build.log | tr '\r\n' ' ')"
              echo "::error title=WhatWentWrong::$(grep -m 1 -A 2 'What went wrong:' ../build.log | tr '\r\n' ' ')"
              cat ../build.log
              exit 1
            }
          }

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MySpotify-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish Direct APK Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: mobile-v0.4.47
          name: "MySpotify Mobile Edition (v0.4.47 - Native AndroidX Media3 ExoPlayer Widevine Engine)"
          body: |
            ### MySpotify Android 客户端 (v0.4.47 原生 ExoPlayer Widevine 播放引擎)
            - **彻底根治「拖/点进度条就没声音」与「切后台/息屏停播」**：
              - 实机 `CCodec` 日志确认：Android WebView 的 Chromium `MediaCodecAudioDecoder` 在对 Widevine 加密 AAC 流执行 seek `flush()` 时会触发 `c2.android.aac.decoder:EncryptedInput createNewBuffer is failed`，导致进度条继续走但音频输出静默；同时切后台/息屏时 WebView 会停止 `AAudio` 甚至触发渲染进程被杀。
              - **全面升级为 Android 官方流媒体内核 AndroidX Media3 ExoPlayer 1.4.1 + 原生 Widevine DRM**：完全在后台前台服务 [MediaPlaybackService.java](android/app/src/main/java/dev/margbug/vinyl/MediaPlaybackService.java) 内运行，彻底移除隐藏 WebView！
              - 支持：**丝滑任意拖动进度条不静音、息屏/切后台持续播放、原生 6 段硬件均衡器直接作用于 Spotify 加密流、倍速播放、锁屏与蓝牙切歌、Free 账号自动 128k 降级**。
            - **免重登直接覆盖升级**：使用固定签名，直接保留账号与本地缓存。
          files: android/app/build/outputs/apk/debug/*.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
