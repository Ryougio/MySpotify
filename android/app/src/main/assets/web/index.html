<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MySpotify</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-dark">
    <div id="app" class="app-layout">
        <!-- 桌面端侧边栏 (Sidebar: 232px) -->
        <aside class="app-sidebar" id="appSidebar">
            <div class="sidebar-header">
                <div class="app-brand">
                    <svg class="brand-logo" viewBox="0 0 24 24" fill="currentColor">
                        <circle cx="12" cy="12" r="10" fill="#1ed760"/>
                        <path d="M7 9.5c3.5-1 7.5-.5 10.5 1.2" stroke="#141416" stroke-width="2" stroke-linecap="round" fill="none"/>
                        <path d="M7.5 12.5c3-.8 6.5-.4 9 1" stroke="#141416" stroke-width="1.8" stroke-linecap="round" fill="none"/>
                        <path d="M8 15.5c2.3-.6 5-.3 7 .8" stroke="#141416" stroke-width="1.6" stroke-linecap="round" fill="none"/>
                    </svg>
                    <span class="brand-title">MySpotify</span>
                </div>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-section-title">浏览</div>
                <button class="nav-item active" data-page="home">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 9v11a1 1 0 0 0 1 1h4v-6h6v6h4a1 1 0 0 0 1-1V9z"/></svg>
                    <span class="nav-label">首页</span>
                </button>
                <button class="nav-item" data-page="daily">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M8 2.5v4"/><path d="M16 2.5v4"/><path d="M3 10h18"/></svg>
                    <span class="nav-label">每日推荐</span>
                </button>
                <button class="nav-item" data-page="charts">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg>
                    <span class="nav-label">排行榜</span>
                </button>
                <button class="nav-item" data-page="browse">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/></svg>
                    <span class="nav-label">浏览全部</span>
                </button>

                <div class="nav-section-title">我的音乐库</div>
                <button class="nav-item" data-page="liked">
                    <svg class="nav-icon icon-heart-filled" viewBox="0 0 24 24" fill="#1ed760"><path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7z"/></svg>
                    <span class="nav-label">已点赞歌曲</span>
                </button>
                <button class="nav-item" data-page="recent">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
                    <span class="nav-label">最近播放</span>
                </button>
                <button class="nav-item" data-page="settings">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
                    <span class="nav-label">设置</span>
                </button>
            </nav>

            <div class="sidebar-footer">
                <div class="user-pill">
                    <div class="user-avatar">M</div>
                    <span class="user-name">访客模式</span>
                </div>
            </div>
        </aside>

        <!-- 主内容区域 (Main Content) -->
        <main class="app-main">
            <!-- 顶部导航栏 (Page Top Header) -->
            <header class="app-header">
                <div class="header-left">
                    <button class="icon-btn mobile-menu-btn" id="mobileMenuBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                    </button>
                    <div class="history-controls">
                        <button class="circle-btn" id="btnBack">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
                        </button>
                        <button class="circle-btn" id="btnForward">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
                        </button>
                    </div>
                    <div class="search-input-wrap">
                        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                        <input type="text" id="searchInput" placeholder="搜索歌曲、艺人、专辑或播客..." autocomplete="off">
                        <button class="clear-search-btn" id="clearSearchBtn" style="display:none;">&times;</button>
                    </div>
                </div>
                <div class="header-right">
                    <button class="pill-btn-login" id="btnLogin">登录 Spotify</button>
                </div>
            </header>

            <!-- 动态页面内容容器 -->
            <div class="page-content" id="pageContent">
                <!-- 首页视图 (Home) -->
                <section class="view-page view-home active" id="viewHome">
                    <h1 class="page-title">早上好</h1>
                    
                    <!-- 快捷访问网格 -->
                    <div class="quick-access-grid" id="quickGrid"></div>

                    <!-- 每日推荐 -->
                    <div class="content-section">
                        <div class="section-header">
                            <h2 class="section-title">为你打造的每日精选</h2>
                            <span class="section-more">全部</span>
                        </div>
                        <div class="cards-carousel" id="dailyMixes"></div>
                    </div>

                    <!-- 热门排行榜 -->
                    <div class="content-section">
                        <div class="section-header">
                            <h2 class="section-title">热门单曲榜</h2>
                        </div>
                        <div class="track-table-wrap">
                            <table class="track-table" id="homeTopTracksTable">
                                <thead>
                                    <tr>
                                        <th style="width: 48px;">#</th>
                                        <th>标题</th>
                                        <th>专辑</th>
                                        <th style="text-align: right; width: 80px;">时长</th>
                                    </tr>
                                </thead>
                                <tbody id="homeTopTracksBody"></tbody>
                            </table>
                        </div>
                    </div>
                </section>

                <!-- 搜索视图 (Search) -->
                <section class="view-page view-search" id="viewSearch">
                    <div class="search-tags-bar">
                        <button class="filter-chip active" data-filter="all">全部</button>
                        <button class="filter-chip" data-filter="track">单曲</button>
                        <button class="filter-chip" data-filter="playlist">歌单</button>
                        <button class="filter-chip" data-filter="artist">艺人</button>
                    </div>
                    <div class="search-results-wrap" id="searchResultsWrap">
                        <div class="empty-state">输入关键词开始实时搜索</div>
                    </div>
                </section>

                <!-- 排行榜视图 (Charts) -->
                <section class="view-page view-charts" id="viewCharts">
                    <h1 class="page-title">全球与地区榜单</h1>
                    <div class="charts-grid" id="chartsGrid"></div>
                </section>

                <!-- 设置视图 (Settings) -->
                <section class="view-page view-settings" id="viewSettings">
                    <h1 class="page-title">设置</h1>
                    <div class="settings-group">
                        <h3 class="settings-group-title">外观与主题</h3>
                        <div class="setting-item">
                            <div class="setting-info">
                                <div class="setting-name">深色模式</div>
                                <div class="setting-desc">保持与桌面端一致的极简纯黑质感</div>
                            </div>
                            <div class="setting-control">
                                <span class="tag-status">已启用</span>
                            </div>
                        </div>
                    </div>
                    <div class="settings-group">
                        <h3 class="settings-group-title">歌词解析</h3>
                        <div class="setting-item">
                            <div class="setting-info">
                                <div class="setting-name">智能多源歌词</div>
                                <div class="setting-desc">Spotify 原生歌词缺失时，自动对齐网易云音乐与 LRCLIB 同步滚动歌词</div>
                            </div>
                            <div class="setting-control">
                                <span class="tag-status">智能推荐中</span>
                            </div>
                        </div>
                    </div>
                    <div class="settings-group">
                        <h3 class="settings-group-title">关于</h3>
                        <div class="setting-item">
                            <div class="setting-info">
                                <div class="setting-name">MySpotify for Android</div>
                                <div class="setting-desc">版本 v0.4.29 (桌面级核心架构重构版)</div>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </main>

        <!-- 底部常驻播放栏 (Persistent Desktop Player Bar: 76px) -->
        <footer class="app-player-bar" id="playerBar">
            <!-- 左侧：当前歌曲信息 -->
            <div class="player-left" id="playerLeftInfo">
                <div class="track-thumb-wrap" id="barCoverWrap">
                    <img src="" class="track-thumb" id="barTrackCover" alt="Cover">
                    <div class="track-thumb-overlay">
                        <svg viewBox="0 0 24 24" fill="white"><path d="M12 3 4 9v11a1 1 0 0 0 1 1h4v-6h6v6h4a1 1 0 0 0 1-1V9z"/></svg>
                    </div>
                </div>
                <div class="track-meta">
                    <div class="track-title" id="barTrackTitle">未在播放</div>
                    <div class="track-artist" id="barTrackArtist">选择一首歌曲开始聆听</div>
                </div>
                <button class="icon-btn-subtle" id="barBtnLike">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7z"/></svg>
                </button>
            </div>

            <!-- 中间：控制按键与彗星光尾进度条 -->
            <div class="player-center">
                <div class="playback-controls">
                    <button class="icon-btn-ctrl" id="btnShuffle" title="随机播放">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.8-1.1 2-1.7 3.3-1.7H22"/><path d="m18 2 4 4-4 4"/><path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/><path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8"/><path d="m18 14 4 4-4 4"/></svg>
                    </button>
                    <button class="icon-btn-ctrl" id="btnPrev" title="上一首">
                        <svg viewBox="0 0 24 24" fill="currentColor"><g transform="matrix(-1 0 0 1 24 0)"><path d="M3 5.6v12.8c0 .8.9 1.3 1.6.8l9.4-6.4c.6-.4.6-1.2 0-1.6L4.6 4.8C3.9 4.3 3 4.8 3 5.6z"/><path d="M12 5.6v12.8c0 .8.9 1.3 1.6.8l9.4-6.4c.6-.4.6-1.2 0-1.6l-9.4-6.4c-.7-.5-1.6 0-1.6.8z" transform="translate(-1.5 0)"/></g></svg>
                    </button>
                    <button class="play-pause-btn" id="btnPlayPause" title="播放/暂停">
                        <svg class="icon-play" id="iconPlay" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.6v14.8c0 .8.9 1.3 1.6.9l12-7.4c.6-.4.6-1.3 0-1.7l-12-7.4C7.9 3.3 7 3.8 7 4.6z"/></svg>
                        <svg class="icon-pause" id="iconPause" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><rect x="5.5" y="4" width="4.5" height="16" rx="1.4"/><rect x="14" y="4" width="4.5" height="16" rx="1.4"/></svg>
                    </button>
                    <button class="icon-btn-ctrl" id="btnNext" title="下一首">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 5.6v12.8c0 .8.9 1.3 1.6.8l9.4-6.4c.6-.4.6-1.2 0-1.6L4.6 4.8C3.9 4.3 3 4.8 3 5.6z"/><path d="M12 5.6v12.8c0 .8.9 1.3 1.6.8l9.4-6.4c.6-.4.6-1.2 0-1.6l-9.4-6.4c-.7-.5-1.6 0-1.6.8z" transform="translate(-1.5 0)"/></svg>
                    </button>
                    <button class="icon-btn-ctrl" id="btnRepeat" title="列表循环">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>
                    </button>
                </div>
                <div class="progress-container">
                    <span class="time-label" id="timeCurrent">0:00</span>
                    <div class="slider-track" id="scrubberTrack">
                        <div class="slider-fill" id="scrubberFill"></div>
                        <div class="slider-thumb" id="scrubberThumb"></div>
                    </div>
                    <span class="time-label" id="timeDuration">0:00</span>
                </div>
            </div>

            <!-- 右侧：歌词 / 队列 / 音量 / 展开播放详情 -->
            <div class="player-right">
                <button class="icon-btn-ctrl" id="btnToggleLyrics" title="滚动歌词">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M8 9h8"/><path d="M8 13h5"/></svg>
                </button>
                <div class="volume-box">
                    <button class="icon-btn-ctrl" id="btnVolume">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M11 4.7a.7.7 0 0 0-1.2-.5L6.4 7.6A1.4 1.4 0 0 1 5.4 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.4a1.4 1.4 0 0 1 1 .4l3.4 3.4a.7.7 0 0 0 1.2-.5z"/><path d="M16 9a5 5 0 0 1 0 6"/><path d="M19.4 18.4a9 9 0 0 0 0-12.8"/></svg>
                    </button>
                    <div class="volume-slider-track" id="volumeTrack">
                        <div class="volume-slider-fill" id="volumeFill" style="width: 80%;"></div>
                    </div>
                </div>
                <button class="icon-btn-ctrl" id="btnExpandNowPlaying" title="全屏正在播放">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="m21 3-7 7"/><path d="m3 21 7-7"/></svg>
                </button>
            </div>
        </footer>

        <!-- 桌面全屏正在播放舞台 (Now Playing Stage & Synced Lyrics) -->
        <div class="now-playing-overlay" id="nowPlayingOverlay">
            <div class="dynamic-backdrop" id="dynamicBackdrop"></div>
            
            <div class="np-header">
                <button class="circle-btn" id="btnCloseNowPlaying">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
                </button>
                <div class="np-header-title">正在播放</div>
                <div style="width: 36px;"></div>
            </div>

            <div class="np-content-layout">
                <!-- 左列：大尺寸封面与信息 -->
                <div class="np-left-column">
                    <div class="vinyl-art-frame">
                        <img src="" class="np-large-cover" id="npLargeCover" alt="Album Cover">
                    </div>
                    <div class="np-track-details">
                        <h2 class="np-song-name" id="npSongName">歌曲名</h2>
                        <h3 class="np-artist-name" id="npArtistName">歌手</h3>
                    </div>
                </div>

                <!-- 右列：逐字同步滚动歌词 -->
                <div class="np-right-column">
                    <div class="lyrics-scroll-container" id="lyricsContainer">
                        <div class="lyrics-lines-wrapper" id="lyricsWrapper">
                            <div class="lyric-line-placeholder">暂无滚动歌词</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 音频底层播放器 -->
    <audio id="audioPlayer" preload="auto"></audio>

    <script src="app.js"></script>
</body>
</html>
