<!doctype html>
<meta charset="utf-8">
<title>MySpotify Widevine Player</title>
<script>/*__HLS_JS_INLINE__*/</script>
<script>
// Android WebView Widevine EME + HLS.js Audio Engine
// Ported from upstream internal/player/web/player.html (margbug01/MySpotify)
(function () {
  let cur = null;
  let volume = 1.0;
  let fadeSecs = 0;
  let leaving = null;
  let currentRate = 1.0;

  const ks = /[?&]ks=([^&]*)/.exec(location.search);
  const keySystem = ks ? decodeURIComponent(ks[1]) : 'com.widevine.alpha';

  const send = (gen, type, t, msg, seq) => {
    try {
      fetch('/event', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          gen: gen || 0,
          type: type || '',
          t: Number.isFinite(t) ? t : 0,
          msg: msg || '',
          seq: seq || 0
        })
      }).catch(() => {});
    } catch (e) {}
  };

  function setVolume(t) {
    if (t && t.a) {
      t.a.volume = Math.max(0, Math.min(1, volume * t.level));
    }
  }

  function finishOverlap() {
    if (leaving) {
      const old = leaving;
      leaving = null;
      destroy(old);
    }
    if (cur) {
      clearInterval(cur.ramp);
      cur.lead = 0;
      cur.level = 1;
      setVolume(cur);
    }
  }

  function startOverlap(t) {
    const old = leaving;
    const secs = old && !old.a.ended && !old.a.paused
      ? Math.min(t.lead, (old.a.duration || 0) - old.a.currentTime)
      : 0;
    t.lead = 0;
    if (!(secs > 0)) return finishOverlap();
    const start = performance.now();
    const oldLevel = old.level;
    t.ramp = setInterval(() => {
      const angle = Math.min(1, (performance.now() - start) / (secs * 1000)) * Math.PI / 2;
      t.level = Math.sin(angle);
      old.level = oldLevel * Math.cos(angle);
      setVolume(t);
      setVolume(old);
      if (angle >= Math.PI / 2) finishOverlap();
    }, 50);
  }

  function destroy(t) {
    if (!t) return;
    clearTimeout(t.pauseTimer);
    clearTimeout(t.endTimer);
    clearInterval(t.watch);
    clearInterval(t.ramp);
    try { if (t.hls) t.hls.destroy(); } catch (e) {}
    try { if (t.src) t.src.disconnect(); } catch (e) {}
    try {
      t.a.pause();
      t.a.removeAttribute('src');
      t.a.load();
      t.a.remove();
    } catch (e) {}
  }

  function rest(t) {
    clearTimeout(t.pauseTimer);
    t.pauseTimer = setTimeout(() => {
      if (cur === t && !t.want && t.hls && t.hls.stopLoad) {
        t.hls.stopLoad();
        t.stopped = true;
      }
    }, 30000);
  }

  function wake(t) {
    clearTimeout(t.pauseTimer);
    if (t.stopped && t.hls && t.hls.startLoad) {
      t.hls.startLoad(t.a.currentTime);
      t.stopped = false;
    }
  }

  function nativePlayer(a, handlers) {
    let src = '';
    return {
      on(name, fn) { if (name === Hls.Events.ERROR) handlers.push(fn); },
      loadSource(s) { src = s; a.src = s; },
      attachMedia() {},
      startLoad() {},
      stopLoad() {},
      recoverMediaError() {
        const at = a.currentTime;
        a.addEventListener('loadedmetadata', () => { a.currentTime = at; }, { once: true });
        a.src = src;
      },
      destroy() {
        a.removeAttribute('src');
        a.load();
      }
    };
  }

  const eqHz = [60, 150, 400, 1000, 2400, 15000];
  let eq = null;
  function eqAttach(t) {
    if (!eq || !t || t.src) return;
    try {
      t.src = eq.ctx.createMediaElementSource(t.a);
      t.src.connect(eq.filters[0]);
    } catch (e) {
      console.warn('eqAttach skipped:', e);
    }
  }

  window.vinyl = {
    eq(gains) {
      if (!gains) {
        if (eq) eq.filters.forEach(b => { b.gain.value = 0; });
        return;
      }
      if (!eq) {
        try {
          const AC = window.AudioContext || window.webkitAudioContext;
          const ctx = new AC();
          const filters = eqHz.map((f, i) => {
            const b = ctx.createBiquadFilter();
            b.type = i === 0 ? 'lowshelf' : i === eqHz.length - 1 ? 'highshelf' : 'peaking';
            b.frequency.value = f;
            return b;
          });
          filters.forEach((b, i) => b.connect(filters[i + 1] || ctx.destination));
          eq = { ctx, filters };
        } catch (e) {
          console.warn('EQ init failed:', e);
          return;
        }
      }
      eq.filters.forEach((b, i) => { b.gain.value = gains[i] || 0; });
      if (eq.ctx.state === 'suspended') eq.ctx.resume().catch(() => {});
      if (cur && cur.file) eqAttach(cur); // Only attach WebAudio to non-EME tracks to avoid Widevine silence
    },

    load(gen, kind, lead) {
      const file = kind === 'file';
      if (cur) {
        if (lead > 0 && !file && !cur.file && cur.want && !cur.a.paused) {
          window.vinyl.leave(cur.gen);
        } else {
          window.vinyl.unload(cur.gen);
        }
      }
      if (!(lead > 0 && leaving)) {
        finishOverlap();
        lead = 0;
      }

      const a = document.createElement('audio');
      a.volume = lead > 0 ? 0 : volume;
      a.playsInline = true;
      a.preload = 'auto';
      a.defaultPlaybackRate = currentRate;
      a.playbackRate = currentRate;
      document.body.appendChild(a);

      const hls = file
        ? nativePlayer(a, [])
        : new Hls({
            emeEnabled: true,
            debug: false,
            enableWorker: false,
            maxBufferLength: 30,
            maxMaxBufferLength: 60,
            maxBufferSize: 4 * 1024 * 1024,
            backBufferLength: 30,
            drmSystems: {
              [keySystem]: {
                licenseUrl: '/license?gen=' + gen,
                serverCertificateUrl: '/cert?gen=' + gen
              }
            },
            requestMediaKeySystemAccessFunc: (ksName, configs) => {
              // Ensure robust Android Widevine config (prefer SW_SECURE_CRYPTO / L3 compatible)
              const patched = configs.map(cfg => {
                const copy = Object.assign({}, cfg);
                if (Array.isArray(copy.audioCapabilities)) {
                  copy.audioCapabilities = copy.audioCapabilities.map(ac => {
                    const acCopy = Object.assign({}, ac);
                    if (!acCopy.robustness) acCopy.robustness = 'SW_SECURE_CRYPTO';
                    return acCopy;
                  });
                }
                return copy;
              });
              return navigator.requestMediaKeySystemAccess(ksName, patched)
                .catch(() => navigator.requestMediaKeySystemAccess(ksName, configs));
            }
          });

      const t = {
        gen, a, hls, file,
        seek: null, tries: 0, want: false, asked: 0,
        endSeq: 0, ending: false, lastTime: 0, still: 0,
        heard: false, near: false,
        lead: lead > 0 ? lead : 0,
        level: lead > 0 ? 0 : 1
      };
      if (file) eqAttach(t);

      const finish = (reason) => {
        if (cur !== t || t.ending) return;
        t.ending = true;
        const seq = ++t.endSeq;
        send(gen, 'ended', a.currentTime, reason, seq);
      };

      t.watch = setInterval(() => {
        const position = a.currentTime;
        const moved = position > t.lastTime + 0.001;
        t.lastTime = position;
        const duration = a.duration;
        const tail = Number.isFinite(duration) && duration > 0 && position >= duration - 0.35 && position <= duration + 0.35;
        const buffered = a.buffered;
        const complete = buffered.length > 0 && buffered.start(buffered.length - 1) <= position && buffered.end(buffered.length - 1) >= duration - 0.1;
        if (!t.want || t.ending || !t.heard || a.paused || a.seeking || a.error || !tail || !complete || moved) {
          t.still = 0;
          return;
        }
        if (++t.still >= 4) finish('tail stalled');
      }, 1000);

      const src = '/m/' + gen + (file ? '/0' : '/track.m3u8');

      const fail = (what) => {
        console.error('[VinylPlayer] fail gen=' + gen, what);
        const again = t.tries < 2 && what.type !== 'licence';
        if (!again) return send(gen, 'error', a.currentTime, what.msg);
        t.tries++;
        send(gen, 'retry', a.currentTime, what.msg);
        if (what.type === Hls.ErrorTypes.NETWORK_ERROR) {
          if (what.details && what.details.startsWith('manifest')) hls.loadSource(src);
          else hls.startLoad();
        } else {
          hls.recoverMediaError();
          if (t.want) a.play().catch(() => {});
        }
      };

      hls.on(Hls.Events.ERROR, (e, d) => {
        if (!d) return;
        console.warn('[VinylPlayer] HLS event error fatal=' + d.fatal + ' type=' + d.type + ' details=' + d.details);
        if (!d.fatal) return;
        const code = d.response && d.response.code ? ' http=' + d.response.code : '';
        const msg = d.type + ' ' + d.details + code;
        fail({
          type: d.type === Hls.ErrorTypes.KEY_SYSTEM_ERROR ? 'licence' : d.type,
          details: d.details || '',
          msg
        });
      });

      for (const n of ['playing', 'pause', 'waiting', 'seeked']) {
        a.addEventListener(n, () => {
          if (n === 'playing') {
            t.heard = true;
            if (cur === t && t.lead) startOverlap(t);
          }
          send(gen, n, a.currentTime);
        });
      }

      a.addEventListener('ended', () => {
        if (leaving === t) finishOverlap();
        else finish('media ended');
      });

      a.addEventListener('seeking', () => { t.still = 0; t.heard = false; });

      let lastSentTime = -1;
      a.addEventListener('timeupdate', () => {
        const now = a.currentTime;
        if (Math.abs(now - lastSentTime) >= 0.45) {
          lastSentTime = now;
          send(gen, 'time', now);
        }
        if (fadeSecs > 0 && cur === t && t.want && !t.near && !file && a.duration > fadeSecs * 3 && a.duration - now <= fadeSecs + 0.5) {
          t.near = true;
          send(gen, 'near', now);
        }
      });

      a.addEventListener('error', () => {
        const err = a.error;
        fail({
          type: Hls.ErrorTypes.MEDIA_ERROR,
          details: 'audioElementError',
          msg: 'media ' + (err ? err.code + ' ' + (err.message || '') : 'unknown')
        });
      });

      a.addEventListener('loadedmetadata', () => {
        if (t.seek != null) {
          a.currentTime = t.seek;
          t.seek = null;
        }
        if (Number.isFinite(a.duration) && a.duration > 0) {
          send(gen, 'duration', a.duration);
        }
      });

      hls.loadSource(src);
      hls.attachMedia(a);
      cur = t;
    },

    play(gen, asked) {
      if (!cur || cur.gen !== gen) return;
      const a = cur.a;
      cur.want = true;
      if (asked) cur.asked = asked;
      wake(cur);
      const p = a.play();
      if (p) {
        p.catch((e) => {
          if (e && e.name !== 'AbortError') {
            console.error('[VinylPlayer] play rejected:', e);
            send(gen, 'error', a.currentTime, 'play ' + e.name + ': ' + e.message);
          }
        });
      }
    },

    pause(gen, asked) {
      if (!cur || cur.gen !== gen) return;
      finishOverlap();
      cur.want = false;
      if (asked) cur.asked = asked;
      cur.still = 0;
      cur.a.pause();
      rest(cur);
    },

    seek(gen, sec) {
      if (!cur || cur.gen !== gen) return;
      finishOverlap();
      cur.near = false;
      cur.ending = false;
      cur.still = 0;
      cur.heard = false;
      clearTimeout(cur.endTimer);
      if (cur.a.readyState >= 1) cur.a.currentTime = sec;
      else cur.seek = sec;
    },

    volume(v) {
      volume = Math.max(0, Math.min(1, v));
      if (cur) setVolume(cur);
      if (leaving) setVolume(leaving);
    },

    crossfade(secs) {
      fadeSecs = Math.max(0, Number(secs) || 0);
    },

    leave(gen) {
      if (!cur || cur.gen !== gen) return;
      finishOverlap();
      leaving = cur;
      clearInterval(leaving.watch);
      cur = null;
    },

    rate(gen, r) {
      currentRate = Math.max(0.5, Math.min(2.5, Number(r) || 1.0));
      if (cur && (!gen || cur.gen === gen)) {
        cur.a.defaultPlaybackRate = currentRate;
        cur.a.playbackRate = currentRate;
      }
    },

    unload(gen) {
      if (leaving && leaving.gen === gen) finishOverlap();
      if (!cur || cur.gen !== gen) return;
      const old = cur;
      cur = null;
      finishOverlap();
      destroy(old);
    }
  };

  const hlsOk = (typeof Hls !== 'undefined' && Hls.isSupported());
  console.log('[VinylPlayer] ready, isSecureContext=' + window.isSecureContext + ', Hls.isSupported=' + hlsOk);
  send(0, 'ready', 0, 'secure=' + window.isSecureContext + ',hls=' + hlsOk);
})();
</script>
